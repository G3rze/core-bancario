spring.application.name=core-bancario

# Cliente/Cuenta/Empleado viven en Postgres via JPA. Transaccion sigue en
# backend/datos/*.dat (ver dao/ArchivoDao) pero solo como log plano
# (RegistroTransaccion), desacoplado de las entidades JPA a proposito -ver
# CLAUDE.md-.

# Variables leidas de backend/.env (spring-dotenv). Ver .env.example.
server.port=${SERVER_PORT:8080}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
logging.level.com.banco.core=${LOG_LEVEL:INFO}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_bancario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# ddl-auto=update es suficiente para este avance academico (sin
# Flyway/Liquibase); Hibernate crea/ajusta las tablas solo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cada cuanto corre el hilo de capitalizacion de intereses (ver
# CalculoInteresScheduler). Default 24h; bajarlo via .env para verlo correr
# en una demo sin esperar un dia real.
banco.intereses.periodo-ms=${INTERES_PERIODO_MS:86400000}

# JWT: el secreto no tiene default a proposito (si falta en .env, la app no
# debe arrancar con una clave conocida). Ver security/JwtService.
banco.jwt.secret=${JWT_SECRET}
banco.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Bootstrap: primer gerente y primer administrador (ver config/BootstrapUsuariosRunner).
# Vacios = no se crea nada. Solo se crean si todavia no existe uno de ese rol.
banco.bootstrap.gerente.dui=${BOOTSTRAP_GERENTE_DUI:}
banco.bootstrap.gerente.nombre=${BOOTSTRAP_GERENTE_NOMBRE:Gerente General}
banco.bootstrap.gerente.password=${BOOTSTRAP_GERENTE_PASSWORD:}
banco.bootstrap.admin.dui=${BOOTSTRAP_ADMIN_DUI:}
banco.bootstrap.admin.nombre=${BOOTSTRAP_ADMIN_NOMBRE:Administrador}
banco.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Datos de demostracion (cajero, clientes, cuentas y movimientos). Ver config/DemoDataRunner.
banco.demo.enabled=${DEMO_DATA:false}
