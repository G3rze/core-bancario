# Perfil "test": H2 en memoria en lugar del Postgres real (ver pom.xml).
# Los tests que lo usan van con @ActiveProfiles("test"); asi nunca tocan la
# base de desarrollo ni exigen Docker.
spring.datasource.url=jdbc:h2:mem:core_bancario_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# El esquema se crea desde las entidades al arrancar y se descarta al cerrar.
spring.jpa.hibernate.ddl-auto=create-drop
