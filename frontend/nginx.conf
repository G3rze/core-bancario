server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API se sirve desde el mismo origen (environment.apiBaseUrl = '/api').
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rutas de Angular (SPA): cualquier otra cosa cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
