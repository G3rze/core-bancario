<mat-card>

  <mat-card-header>
    <mat-card-title>Retiro</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <mat-form-field appearance="outline">
      <mat-label>Número de cuenta</mat-label>

      <input
        matInput
        [(ngModel)]="numeroCuenta">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Monto</mat-label>

      <input
        matInput
        type="number"
        [(ngModel)]="monto">
    </mat-form-field>

  </mat-card-content>

  <mat-card-actions>

    <button
      mat-raised-button
      color="warn"
      [disabled]="cargando()"
      (click)="retirar()">

      Retirar

    </button>

  </mat-card-actions>

</mat-card>
