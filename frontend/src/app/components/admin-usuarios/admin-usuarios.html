<mat-card class="admin-usuarios">
  <mat-card-header>
    <mat-card-title>Activar o desactivar usuarios</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>DUI del usuario</mat-label>
      <input matInput name="dui" [(ngModel)]="dui" placeholder="00000000-0" required />
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button mat-flat-button color="primary" type="button" [disabled]="cargando() || !dui" (click)="cambiarEstado(true)">
      Activar
    </button>
    <button mat-stroked-button type="button" [disabled]="cargando() || !dui" (click)="cambiarEstado(false)">
      Desactivar
    </button>
  </mat-card-actions>
</mat-card>
