<mat-card>
  <mat-card-header>
    <mat-card-title>Apertura de Cuenta</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <mat-form-field appearance="outline">
      <mat-label>DUI del titular</mat-label>
      <input
        matInput
        [(ngModel)]="duiTitular">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de cuenta</mat-label>

      <mat-select [(ngModel)]="tipoCuenta">
        <mat-option value="AHORROS">Ahorros</mat-option>
        <mat-option value="CORRIENTE">Corriente</mat-option>
        <mat-option value="PLAZO_FIJO">Plazo Fijo</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Saldo inicial</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="saldoInicial">
    </mat-form-field>

    @if (tipoCuenta === 'PLAZO_FIJO') {
      <mat-form-field appearance="outline">
        <mat-label>Plazo (meses)</mat-label>
        <input
          matInput
          type="number"
          [(ngModel)]="plazoMeses">
      </mat-form-field>
    }

  </mat-card-content>

  <mat-card-actions>
    <button
      mat-raised-button
      color="primary"
      [disabled]="guardando()"
      (click)="abrirCuenta()">

      Abrir cuenta
    </button>
  </mat-card-actions>
</mat-card>
