<mat-card>

  <mat-card-header>
    <mat-card-title>Transferencia</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <mat-form-field appearance="outline">
      <mat-label>Cuenta origen</mat-label>
      <input matInput [(ngModel)]="cuentaOrigen">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cuenta destino</mat-label>
      <input matInput [(ngModel)]="cuentaDestino">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Monto</mat-label>
      <input matInput type="number" [(ngModel)]="monto">
    </mat-form-field>

  </mat-card-content>

  <mat-card-actions>

    <button
      mat-raised-button
      color="primary"
      [disabled]="cargando()"
      (click)="transferir()">

      Transferir

    </button>

  </mat-card-actions>

</mat-card>
