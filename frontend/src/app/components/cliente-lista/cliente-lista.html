<section class="cliente-lista">
  <h2>Clientes</h2>
  <table>
    <thead>
      <tr>
        <th>No. Cliente</th>
        <th>Nombre</th>
        <th>DUI</th>
        <th>Tipo</th>
        <th>Telefono</th>
      </tr>
    </thead>
    <tbody>
      @for (cliente of clientes; track cliente.numeroCliente) {
        <tr>
          <td>{{ cliente.numeroCliente }}</td>
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.dui }}</td>
          <td>{{ cliente.tipo }}</td>
          <td>{{ cliente.telefono }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
